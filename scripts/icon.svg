<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34302a"/><stop offset="1" stop-color="#141210"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a7020"/><stop offset=".3" stop-color="#ddb850"/>
      <stop offset=".55" stop-color="#b08828"/><stop offset=".8" stop-color="#ddb850"/><stop offset="1" stop-color="#9a7020"/>
    </linearGradient>
  </defs>
  <!-- Full-bleed background (maskable-safe: artwork stays inside the central 80%) -->
  <rect width="512" height="512" fill="url(#body)"/>
  <g transform="translate(96 116)">
    <rect x="0" y="0"   width="132" height="80" rx="14" fill="#1e5c36"/>
    <rect x="0" y="100" width="132" height="80" rx="14" fill="#1c3a70"/>
    <rect x="0" y="200" width="132" height="80" rx="14" fill="#6a2010"/>
    <rect x="0" y="0"   width="132" height="36" rx="14" fill="#fff" opacity=".12"/>
    <rect x="0" y="100" width="132" height="36" rx="14" fill="#fff" opacity=".12"/>
    <rect x="0" y="200" width="132" height="36" rx="14" fill="#fff" opacity=".12"/>
    <rect x="156" y="0" width="164" height="280" rx="14" fill="url(#gold)"/>
    <g stroke="#3c1e00" stroke-width="5" stroke-linecap="round" opacity=".75">
      <line x1="184" y1="20" x2="184" y2="260"/><line x1="212" y1="20" x2="212" y2="260"/>
      <line x1="240" y1="20" x2="240" y2="260"/><line x1="268" y1="20" x2="268" y2="260"/>
      <line x1="296" y1="20" x2="296" y2="260"/>
    </g>
    <line x1="240" y1="20" x2="240" y2="260" stroke="#fff6c8" stroke-width="7" stroke-linecap="round"/>
  </g>
</svg>
