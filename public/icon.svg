<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3632"/><stop offset=".45" stop-color="#1e1c1a"/><stop offset="1" stop-color="#0e0d0c"/>
    </linearGradient>
    <radialGradient id="crt" cx=".5" cy=".45" r=".75">
      <stop offset="0" stop-color="#03301a"/><stop offset=".6" stop-color="#001a0a"/><stop offset="1" stop-color="#000804"/>
    </radialGradient>
    <pattern id="scan" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="3" fill="#000" opacity=".28"/>
    </pattern>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Full-bleed background (removed for the Android adaptive-icon foreground) -->
  <rect width="512" height="512" fill="url(#body)"/>

  <!-- CRT screen: the robot's "sys monitor" (artwork stays inside the maskable safe zone) -->
  <rect x="70" y="122" width="372" height="268" rx="46" fill="#0b1a0e" stroke="#000" stroke-width="6"/>
  <rect x="84" y="136" width="344" height="240" rx="34" fill="url(#crt)"/>
  <rect x="84" y="136" width="344" height="240" rx="34" fill="#00e060" opacity=".06"/>

  <!-- Face (◉ω◉) -->
  <g fill="none" stroke="#3dff8f" stroke-width="13" stroke-linecap="round" filter="url(#glow)">
    <path d="M136 186 Q104 256 136 326"/>
    <path d="M376 186 Q408 256 376 326"/>
    <circle cx="196" cy="242" r="33"/>
    <circle cx="316" cy="242" r="33"/>
    <path d="M226 290 q15 30 30 0 q15 30 30 0"/>
  </g>
  <g fill="#3dff8f" filter="url(#glow)">
    <circle cx="196" cy="242" r="13"/>
    <circle cx="316" cy="242" r="13"/>
  </g>

  <!-- Scanlines + glass highlight -->
  <rect x="84" y="136" width="344" height="240" rx="34" fill="url(#scan)"/>
  <path d="M110 150 H402 Q414 150 414 162 V176 Q256 196 98 176 V162 Q98 150 110 150 Z" fill="#fff" opacity=".06"/>
</svg>
