<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0e0a06">
  <meta name="description" content="OmniSound — chord synthesizer with strumplate, rhythm machine and arpeggiator.">
  <link rel="icon" type="image/svg+xml" href="/icon.svg">
  <title>OmniSound</title>
</head>
<body>

<div class="instrument powered-off" id="instrument">
  <div class="screw tl"></div>
  <div class="screw tr"></div>
  <div class="screw bl"></div>
  <div class="screw br"></div>

  <!-- TOP PANEL: identity + (compact layouts) quick controls -->
  <header class="top-panel">
    <div class="power-section">
      <button type="button" class="power-btn" id="powerBtn" title="Power" aria-label="Power" aria-pressed="false">⏻</button>
      <div class="power-led" id="powerLed"></div>
      <div class="power-tooltip" id="powerTooltip">pressione para ligar</div>
    </div>

    <div class="brand-block">
      <div class="brand-maker">Ganwalk</div>
      <div class="brand-name">OMNISOUND</div>
      <div class="brand-model">CHORD SYNTH</div>
    </div>

    <div class="robot-wrap">
      <div class="robot-screen" id="robotScreen" aria-hidden="true">
        <span class="robot-face-line" id="robotFace">(·_·)</span>
        <span class="robot-status-line" id="robotStatus">· · ·</span>
      </div>
      <div class="robot-label">sys monitor</div>
    </div>

    <div class="led-block">
      <div class="led-display" id="led" aria-live="polite">– – –</div>
      <div class="led-label">chord display</div>
    </div>

    <nav class="quickbar" aria-label="Quick controls">
      <button type="button" class="phys-btn" data-action="rhythm">▶ PLAY</button>
      <button type="button" class="phys-btn" data-action="arp">▶ ARP</button>
      <button type="button" class="phys-btn" data-action="page" id="pageBtn">⇅ EXT</button>
      <button type="button" class="phys-btn quick-icon" data-action="sheet" aria-label="Controls" aria-controls="controls" aria-expanded="false">⚙</button>
    </nav>
  </header>

  <!-- MAIN AREA -->
  <main class="main-area">
    <div class="chord-section">
      <div class="chord-grid" id="chordGrid" data-page="0"></div>
      <div class="kb-hint">1–= 7th · Q–] Major · A–\ Minor · Space = Rhythm · Esc = Silence</div>
    </div>

    <div class="strum-section">
      <button type="button" class="chord-name-badge" id="chordBadge" title="Silence (Esc)" aria-label="Silence chord">
        <span class="chord-label">
          <span class="chord-root" id="chordRoot">–</span>
          <span class="chord-sym"  id="chordSym"></span>
        </span>
        <span class="chord-stop">■ STOP</span>
      </button>
      <div class="strum-frame">
        <div class="frame-screw tl"></div>
        <div class="frame-screw tr"></div>
        <div class="frame-screw bl"></div>
        <div class="frame-screw br"></div>
        <div class="strum-label">◆ Strumplate</div>
        <div id="strumplate"></div>
      </div>
    </div>
  </main>

  <!-- CONTROLS: laid out inline on wide screens, a slide-in sheet on phones -->
  <div class="controls" id="controls" aria-label="Controls">
    <div class="sheet-header">
      <span class="sheet-title">Controls</span>
      <button type="button" class="phys-btn quick-icon" data-action="sheet" aria-label="Close controls">✕</button>
    </div>

    <div class="mixer-panel">
      <label class="knob-group">
        <span class="knob-label">Master</span>
        <input type="range" id="masterVol" data-setting="master" min="0" max="100">
      </label>
      <label class="knob-group">
        <span class="knob-label">Chord</span>
        <input type="range" id="chordVol" data-setting="chordVol" min="0" max="100">
      </label>
      <label class="knob-group">
        <span class="knob-label">Strum</span>
        <input type="range" id="strumVol" data-setting="strumVol" min="0" max="100">
      </label>
      <label class="knob-group">
        <span class="knob-label">Tone</span>
        <input type="range" id="toneCtrl" data-setting="tone" min="0" max="100">
      </label>
      <label class="knob-group">
        <span class="knob-label">Reverb</span>
        <input type="range" id="reverbCtrl" data-setting="reverb" min="0" max="100">
      </label>
      <div class="knob-group">
        <span class="knob-label">Octave</span>
        <div class="oct-switch" id="octaveCtrl" role="group" aria-label="Octave">
          <button type="button" class="oct-btn" data-oct="-1">–1</button>
          <button type="button" class="oct-btn" data-oct="0">0</button>
          <button type="button" class="oct-btn" data-oct="1">+1</button>
        </div>
      </div>
    </div>

    <div class="bottom-panel">
      <section class="panel-box rhythm-panel">
        <h2 class="panel-title">Rhythm &amp; Accompaniment</h2>
        <div class="panel-row">
          <button type="button" class="phys-btn" data-action="rhythm">▶ PLAY</button>
          <label class="knob-group tempo-group">
            <span class="knob-label">Tempo</span>
            <span class="tempo-row">
              <input type="range" id="bpmCtrl" min="40" max="220">
              <span class="bpm-val" id="bpmVal">110</span>
            </span>
          </label>
          <label class="knob-group">
            <span class="knob-label">Rhythm Vol</span>
            <input type="range" id="rhythmVol" data-setting="rhythmVol" min="0" max="100">
          </label>
        </div>
        <div class="panel-row" id="patternBtns" role="group" aria-label="Rhythm pattern"></div>
      </section>

      <section class="panel-box arp-panel">
        <h2 class="panel-title">Auto Strum / Arpeggiator</h2>
        <div class="panel-row">
          <button type="button" class="phys-btn" data-action="arp">▶ ARP</button>
          <div class="arp-divider"></div>
          <label class="knob-group">
            <span class="knob-label">Speed</span>
            <input type="range" id="arpSpeedCtrl" data-setting="arpSpeed" min="0" max="100">
          </label>
          <label class="knob-group">
            <span class="knob-label">Vol</span>
            <input type="range" id="arpVol" data-setting="arpVol" min="0" max="100">
          </label>
          <span class="arp-sync-badge" id="arpSyncBadge">FREE</span>
        </div>
        <div class="arp-mode-row">
          <div class="arp-mode-label">Mode</div>
          <div class="arp-mode-btns" id="arpModeBtns" role="group" aria-label="Arpeggiator mode"></div>
        </div>
      </section>

      <div class="panel-box speaker-panel" aria-hidden="true">
        <div class="panel-title">Speaker</div>
        <div class="speaker-grille" id="speakerGrille"></div>
      </div>
    </div>
  </div>
</div><!-- /instrument -->

<div class="sheet-backdrop" data-action="sheet"></div>

<p class="credits">Desenvolvido por <a href="https://ganwalk.github.io/2026/" target="_blank" rel="noopener">Ganwalk</a></p>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
